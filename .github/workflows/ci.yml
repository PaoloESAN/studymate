name: StudyMate CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studymate_ci?schema=public
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/studymate_ci?schema=public

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: npx next typegen
      - run: npx tsc --noEmit

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test tests/suite.test.ts

  security-audit:
    name: Security & SBOM audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Scan for leaked secrets
        run: |
          if git grep -nE "AIza[0-9A-Za-z_-]{35}|AQ\.Ab8[0-9A-Za-z_-]{20,}" -- . ':(exclude).env*'; then
            echo "Secret pattern detected in tracked files!"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Audit npm dependencies
        run: pnpm audit --audit-level=critical || true
      - name: Generate dependency inventory (SBOM)
        run: pnpm list --depth=0 --json > sbom-dependencies.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-dependencies
          path: sbom-dependencies.json

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: npx next build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next

  integration-smoke-test:
    name: Integration smoke test
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - name: Verify built routes respond HTTP 200
        run: |
          npx next start -p 3000 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for i in $(seq 1 20); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login | grep -q "200"; then
              break
            fi
            sleep 1
          done
          STATUS_LOGIN=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login)
          STATUS_DASH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/dashboard)
          echo "GET /login -> $STATUS_LOGIN"
          echo "GET /dashboard -> $STATUS_DASH"
          test "$STATUS_LOGIN" = "200" && test "$STATUS_DASH" = "200"

  quality-gate:
    name: Quality Gate
    needs: [lint, typecheck, unit-tests, security-audit, integration-smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all quality checks passed
        run: echo "Quality Gate passed: Lint, Typecheck, Unit Tests, Security & SBOM, Build, and Smoke Test succeeded."
